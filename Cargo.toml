[package]
name = "librespeed-rs"
version = "1.4.0"
edition = "2021"
authors = ["Sudo Dios"]
description = "Rust backend for LibreSpeed"

[dependencies]
#async net
tokio = {version = "1.54.1", features = ["net","io-util","rt","macros","rt-multi-thread","sync","signal","time"]}
tokio-rustls = {version = "0.26.6", features = ["tls12","ring"], default-features = false}
webpki-roots = "1.0.11"
rustls-pemfile = "2.2.0"
socket2 = "0.6.5"
listenfd = "1.0.2"
futures = "0.3.34"
#serializer
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
#conf
clap = { version = "4.6.7",features = ["std","color","help","usage"],default-features = false }
toml = "1.1.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock","std"] }
#logging
env_logger = { version = "0.11.11",default-features = false,features = ["auto-color","humantime"] }
log = "0.4.35"
#assets
include_dir = "0.7.4"
case_insensitive_hashmap = "1.0.1"

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
lto = true
strip = true
