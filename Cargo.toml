[package]
name = "librespeed-rs"
version = "2.0.0"
edition = "2024"
authors = ["Sudo Dios", "Tanguy Soubry"]
description = "Rust backend for LibreSpeed"
license-file = "LICENSE.txt"
repository = "https://github.com/Tsoubry/speedtest-rust"
keywords = ["speedtest", "librespeed", "network", "bandwidth", "server"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
#async net
tokio = {version = "1.54.1", features = ["net","io-util","rt","macros","rt-multi-thread","sync","signal","time"]}
tokio-rustls = {version = "0.26.6", features = ["tls12","ring"], default-features = false}
webpki-roots = "1.0.11"
rustls-pemfile = "2.2.0"
socket2 = "0.6.5"
listenfd = "1.0.2"
futures = "0.3.34"
#serializer
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
#conf
clap = { version = "4.6.7",features = ["std","color","help","usage"],default-features = false }
toml = "1.1.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock","std"] }
#logging
env_logger = { version = "0.11.11",default-features = false,features = ["auto-color","humantime"] }
log = "0.4.35"
#assets
include_dir = "0.7.4"
case_insensitive_hashmap = "1.0.1"

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "unwind"
lto = true
strip = true

[lints.rust]
arithmetic_overflow = "deny"
dead_code = "deny"
unnecessary_transmutes = "deny"
unused_crate_dependencies = "deny"
unused_imports = "deny"
unused_results = "deny"

[lints.clippy]
absolute_paths = "deny"
allow_attributes_without_reason = "deny"
arbitrary_source_item_ordering = "deny"
arithmetic_side_effects = "allow"
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
clone_on_ref_ptr = "deny"
doc_paragraphs_missing_punctuation = "deny"
expect_used = "deny"
indexing_slicing = "deny"
integer_division = "allow"
join_absolute_paths = "deny"
let_underscore_must_use = "deny"
min_ident_chars = "deny"
option_env_unwrap = "deny"
panicking_unwrap = "deny"
pedantic = { level = "deny", priority = -1 }
rc_buffer = "deny"
semicolon_inside_block = "deny"
serde_api_misuse = "deny"
shadow_reuse = "deny"
single_char_lifetime_names = "deny"
string_slice = "deny"
todo = "deny"
transmute_ptr_to_ref = "deny"
transmute_undefined_repr = "deny"
undocumented_unsafe_blocks = "deny"
uninit_vec = "deny"
unneeded_field_pattern = "deny"
unseparated_literal_suffix = "deny"
unused_trait_names = "deny"
unwrap_used = "deny"
use_debug = "deny"
wildcard_enum_match_arm = "deny"
